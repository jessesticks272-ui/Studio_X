<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to LyTune Studio X.">
  <meta http-equiv="refresh" content="0; url=auth.html?mode=login">
  <title>Sign in | LyTune Studio X</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="./login.css">

    const params = new URLSearchParams(window.location.search);
    params.set("mode", "login");
    window.location.replace("auth.html?" + params.toString());
  </script>
  <script src="./theme.js"></script>
  <script src="./cloudinary-config.js"></script>
  <script src="./cloudinary-media.js"></script>
</head>
<body>
  <main class="redirect-card">
    <h1>Sign in to LyTune Studio X</h1>
    <p>Taking you to the secure sign-in page…</p>
    <a href="auth.html?mode=login">Continue to sign in</a>
  </main>
</body>
</html>
