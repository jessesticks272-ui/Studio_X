<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Private LyTune Studio X member dashboard.">
<title>Members | LyTune Studio X</title>
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./creator-dashboard.css">
  <link rel="stylesheet" href="./responsive-mobile.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="mark">L</span><span>LyTune <b>Studio X</b></span></a>
  <button id="logoutBtn" class="logout">Sign out</button>
</header>
<main>
  <section class="hero">
    <div class="hero-copy">
      <span class="eyebrow">PRIVATE OWNER DASHBOARD</span>
      <h1>Members who logged in</h1>
      <p id="creatorEmail">Checking your account…</p>
    </div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <div><span class="eyebrow">MEMBER LIST</span><h2>LyTune Studio X members</h2></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Member</th><th>Email</th><th>Role</th><th>Joined</th><th>Last Login</th></tr></thead>
        <tbody id="memberTable"></tbody>
      </table>
    </div>
    <div id="state" class="state">Loading members…</div>
  </section>
</main>
<script type="module" src="./creator-dashboard.js"></script>
</body>
</html>
